<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Digest</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- HEADER -->
    <!-- Note: the panel's own "YouTube Digest" title is shown by Chrome's side-panel
         title bar, so we don't repeat a logo here. -->
    <div class="header">
      <div class="header-top">
        <!-- Video info -->
        <div class="video-info" id="videoInfo" style="display: none">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel"></div>
        </div>
        <div class="header-actions">
          <button
            class="settings-btn"
            id="settingsBtn"
            type="button"
            title="打开 YouTube Digest 设置"
            aria-label="打开 YouTube Digest 设置"
          >
            设置
          </button>
          <div
            class="transcript-mode-control global-language-control"
            id="transcriptModeControl"
            role="group"
            aria-label="内容语言"
            style="display: none"
          >
            <button
              class="transcript-mode-btn active"
              type="button"
              data-transcript-mode="original"
              aria-pressed="true"
            >原文</button>
            <button
              class="transcript-mode-btn"
              type="button"
              data-transcript-mode="zh"
              aria-pressed="false"
            >中文</button>
            <button
              class="transcript-mode-btn"
              type="button"
              data-transcript-mode="bilingual"
              aria-pressed="false"
            >双语</button>
            <span
              class="translation-spinner"
              id="langSpinner"
              aria-label="正在翻译"
            ></span>
          </div>
        </div>
      </div>

      <!-- Tab navigation -->
      <div class="tabs" id="tabsNav" style="display: none">
        <button class="tab active" data-tab="transcript">字幕</button>
        <button class="tab" data-tab="overview">概览</button>
        <button class="tab" data-tab="notes">笔记</button>
      </div>
      <p id="seekStatus" class="seek-status" role="status"></p>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content" id="contentArea">
      <!-- WELCOME STATE -->
      <div id="welcomeState" class="welcome-container">
        <div class="welcome-icon" aria-hidden="true"></div>
        <div class="welcome-title">可以开始了</div>
        <div class="welcome-desc">
          打开 YouTube、哔哩哔哩视频或带视频的 X 帖子，点击「摘要」。
        </div>
      </div>

      <!-- LOADING STATE -->
      <div id="loadingState" style="display: none">
        <div class="loading-container">
          <div class="loading-bar"></div>
          <div class="loading-text" id="loadingText">正在获取字幕</div>
          <div class="loading-subtext" id="loadingSubtext">
            正在从视频提取字幕…
          </div>
        </div>
      </div>

      <!-- ERROR STATE -->
      <div id="errorState" style="display: none">
        <div class="error-container">
          <div class="error-icon" aria-hidden="true">!</div>
          <div class="error-title" id="errorTitle">错误</div>
          <div class="error-message" id="errorMessage">
            出现了问题。
          </div>
          <button class="error-btn" id="errorBtn">重试</button>
        </div>
      </div>

      <section id="transcriptAcquisition" class="transcript-acquisition" hidden>
        <p id="transcriptCoverageStatus"></p>
        <p id="transcriptRequestStatus" role="status"></p>
        <button class="enhance-btn" type="button" data-transcript-method="web">重试读取网页字幕</button>
        <button class="enhance-btn" id="transcriptSettingsBtn" type="button" hidden>打开设置</button>
        <details id="supadataChoices" hidden>
          <summary>Supadata 备用选项</summary>
          <p id="supadataNativeCost">查找现成字幕每个视频 1 点额度。返回字幕不可用时也扣 1 点。</p>
          <button class="enhance-btn" type="button" data-transcript-method="native" aria-describedby="supadataNativeCost">查找现成字幕</button>
          <p id="supadataGenerateCost">从语音生成字幕按视频全长计费，每分钟 2 点额度。</p>
          <button class="enhance-btn" type="button" data-transcript-method="generate" aria-describedby="supadataGenerateCost">转录整个视频</button>
        </details>
      </section>

      <!-- RESULTS -->
      <div id="resultsState" style="display: none">
        <!-- TAB: Transcript (default - no LLM required) -->
        <div class="tab-panel active" data-panel="transcript">
          <div class="section">
            <div class="section-header transcript-section-header">
              <div class="section-title">视频字幕</div>
              <div class="transcript-actions">
                <button class="enhance-btn" id="copyTranscriptBtn">复制</button>
                <button class="enhance-btn" id="exportTranscriptBtn">
                  导出
                </button>
              </div>
            </div>
            <!-- Search stays inside the Transcript tab and never changes playback. -->
            <div class="transcript-search" role="search">
              <svg
                class="transcript-search-icon"
                viewBox="0 0 20 20"
                aria-hidden="true"
              >
                <circle cx="8.5" cy="8.5" r="5.5"></circle>
                <path d="m12.5 12.5 4 4"></path>
              </svg>
              <input
                class="transcript-search-input"
                id="transcriptSearchInput"
                type="search"
                placeholder="搜索单词或短语"
                aria-label="搜索字幕"
                aria-controls="transcriptList"
                autocomplete="off"
                spellcheck="false"
              />
              <button
                class="transcript-search-clear"
                id="transcriptSearchClearBtn"
                type="button"
                aria-label="清除字幕搜索"
                title="清除搜索"
                hidden
              >
                &times;
              </button>
              <output
                class="transcript-search-count"
                id="transcriptSearchCount"
                aria-live="polite"
              ></output>
              <div
                class="transcript-search-nav"
                role="group"
                aria-label="搜索结果"
              >
                <button
                  id="transcriptSearchPrevBtn"
                  type="button"
                  aria-label="上一条字幕匹配结果"
                  title="上一条匹配结果（Shift + Enter）"
                  disabled
                >
                  &#8593;
                </button>
                <button
                  id="transcriptSearchNextBtn"
                  type="button"
                  aria-label="下一条字幕匹配结果"
                  title="下一条匹配结果（Enter）"
                  disabled
                >
                  &#8595;
                </button>
              </div>
            </div>
            <div id="transcriptList"></div>
          </div>
        </div>

        <!-- TAB: Overview (chapters + key quotes) - requires LLM -->
        <div class="tab-panel" data-panel="overview">
          <p class="overview-message" id="overviewCoverage" hidden></p>
          <p class="overview-message" id="overviewLoading" hidden>正在生成概览…</p>
          <p class="overview-message" id="overviewError" role="status"></p>
          <button class="enhance-btn" id="overviewRetry" type="button" hidden>
            重试生成概览
          </button>
          <div id="overviewResults" hidden>
            <div class="section">
              <div class="section-title">章节</div>
              <ul class="chapter-list" id="chapterList"></ul>
              <p class="overview-message" id="chaptersEmpty" hidden>没有可显示的章节。</p>
            </div>
            <div class="section">
              <div class="section-title">重点引用</div>
              <div id="quotesList"></div>
              <p class="overview-message" id="quotesEmpty" hidden>没有可显示的重点引用。</p>
            </div>
          </div>
        </div>

        <!-- TAB: Notes -->
        <div class="tab-panel" data-panel="notes">
          <div class="section">
            <div class="section-header">
              <div class="section-title">已保存的笔记</div>
              <div class="notes-filter">
                <button
                  class="enhance-btn active"
                  id="notesFilterThis"
                  aria-pressed="true"
                >
                  当前视频
                </button>
                <button
                  class="enhance-btn"
                  id="notesFilterAll"
                  aria-pressed="false"
                >
                  全部笔记
                </button>
              </div>
            </div>
            <p class="notes-intro" id="notesIntro">
              将鼠标移到视频上，点击「笔记」即可保存带时间戳的笔记。
              也可以在视频获得焦点时按 N 键。
            </p>
            <div id="notesList"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Auto-scroll follow button — appears when user scrolls away from playback position -->
    <button
      class="follow-playback-btn"
      id="followPlaybackBtn"
      style="display: none"
    >
      跟随播放
    </button>

    <script src="settings.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
